schema_version: "1.0"
workflow:
  id: "speckit-superpowers"
  name: "Spec Kit Design + Superpowers Implementation"
  version: "0.1.1"
  author: "lihan3238"
  description: "Runs specify -> clarify -> plan -> tasks -> analyze -> Superpowers handoff without speckit.implement"

requires:
  speckit_version: ">=0.8.10"
  integrations:
    any: ["codex", "claude"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before clarification and planning."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: superpowers-handoff
    command: speckit.speckit-superpowers-bridge.handoff
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
