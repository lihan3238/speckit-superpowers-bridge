schema_version: "1.0"

extension:
  id: speckit-superpowers-bridge
  name: "Superpowers Implementation Bridge"
  version: "0.2.0"
  description: "Spec Kit stays source of truth while Superpowers executes implementation tasks"
  author: "lihan3238"
  repository: "https://github.com/lihan3238/speckit-superpowers-bridge"
  homepage: "https://github.com/lihan3238/speckit-superpowers-bridge"
  documentation: "https://github.com/lihan3238/speckit-superpowers-bridge#readme"
  license: MIT

requires:
  speckit_version: ">=0.8.10"

provides:
  commands:
    - name: speckit.speckit-superpowers-bridge.handoff
      file: commands/speckit.speckit-superpowers-bridge.handoff.md
      description: "Create or update the Superpowers implementation handoff state"
    - name: speckit.speckit-superpowers-bridge.guard
      file: commands/speckit.speckit-superpowers-bridge.guard.md
      description: "Guard Spec Kit and Superpowers commands from crossing bridge ownership boundaries"
    - name: speckit.speckit-superpowers-bridge.audit
      file: commands/speckit.speckit-superpowers-bridge.audit.md
      description: "Audit bridge install state and Codex/Claude skill parity"
    - name: speckit.speckit-superpowers-bridge.validate
      file: commands/speckit.speckit-superpowers-bridge.validate.md
      description: "Run the bridge end-to-end validation pass"
    - name: speckit.speckit-superpowers-bridge.parity
      file: commands/speckit.speckit-superpowers-bridge.parity.md
      description: "Audit bridge disposition matrix, version pins, and agent parity"
    - name: speckit.speckit-superpowers-bridge.recommend-route
      file: commands/speckit.speckit-superpowers-bridge.recommend-route.md
      description: "Emit advisory routing recommendation before the full Spec Kit pipeline"
    - name: speckit.speckit-superpowers-bridge.execute
      file: commands/speckit.speckit-superpowers-bridge.execute.md
      description: "Execute Spec Kit tasks.md through the Superpowers bridge"
    - name: speckit.speckit-superpowers-bridge.submission-checklist
      file: commands/speckit.speckit-superpowers-bridge.submission-checklist.md
      description: "Local mirror of upstream Spec Kit catalog submission verification"
    - name: speckit.speckit-superpowers-bridge.cleanup-audit
      file: commands/speckit.speckit-superpowers-bridge.cleanup-audit.md
      description: "Pre-release source-repo cleanup audit (backup files, unreferenced docs, manifest consistency)"

hooks:
  before_specify:
    command: speckit.speckit-superpowers-bridge.recommend-route
    optional: false
    description: "Suggest direct Superpowers route for small-scope changes before full specification"
  before_clarify:
    command: speckit.speckit-superpowers-bridge.guard
    optional: false
    description: "Prevent Spec Kit contract changes while Superpowers implementation is executing"
  before_plan:
    command: speckit.speckit-superpowers-bridge.guard
    optional: false
    description: "Prevent Spec Kit contract changes while Superpowers implementation is executing"
  before_tasks:
    command: speckit.speckit-superpowers-bridge.guard
    optional: false
    description: "Prevent Spec Kit contract changes while Superpowers implementation is executing"
  before_implement:
    command: speckit.speckit-superpowers-bridge.guard
    optional: false
    description: "Block speckit.implement for features handed off to Superpowers"
  after_tasks:
    command: speckit.speckit-superpowers-bridge.handoff
    optional: false
    description: "Create the Superpowers handoff after Spec Kit task generation"

tags:
  - bridge
  - superpowers
  - cross-agent
  - governance
  - tdd
  - workflow
