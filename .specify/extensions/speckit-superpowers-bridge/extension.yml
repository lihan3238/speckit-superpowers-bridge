schema_version: "1.0"

extension:
  id: speckit-superpowers-bridge
  name: "Superpowers Implementation Bridge"
  version: "0.1.0"
  description: "Hands Spec Kit tasks to Superpowers for implementation without running speckit.implement"
  author: local
  repository: local
  license: MIT

requires:
  speckit_version: ">=0.8.9"

provides:
  commands:
    - name: speckit.superpowers.handoff
      file: commands/speckit.superpowers.handoff.md
      description: "Create or update the Superpowers implementation handoff state"
    - name: speckit.superpowers.guard
      file: commands/speckit.superpowers.guard.md
      description: "Guard Spec Kit and Superpowers commands from crossing bridge ownership boundaries"
    - name: speckit.superpowers.audit
      file: commands/speckit.superpowers.audit.md
      description: "Audit bridge install state and Codex/Claude skill parity"
    - name: speckit.superpowers.validate
      file: commands/speckit.superpowers.validate.md
      description: "Run the bridge end-to-end validation pass"
    - name: speckit.superpowers.recommend-route
      file: commands/speckit.superpowers.recommend-route.md
      description: "Emit advisory routing recommendation before the full Spec Kit pipeline"

hooks:
  before_specify:
    command: speckit.superpowers.recommend-route
    optional: false
    description: "Suggest direct Superpowers route for small-scope changes before full specification"
  before_clarify:
    command: speckit.superpowers.guard
    optional: false
    description: "Prevent Spec Kit contract changes while Superpowers implementation is executing"
  before_plan:
    command: speckit.superpowers.guard
    optional: false
    description: "Prevent Spec Kit contract changes while Superpowers implementation is executing"
  before_tasks:
    command: speckit.superpowers.guard
    optional: false
    description: "Prevent Spec Kit contract changes while Superpowers implementation is executing"
  before_implement:
    command: speckit.superpowers.guard
    optional: false
    description: "Block speckit.implement for features handed off to Superpowers"
  after_tasks:
    command: speckit.superpowers.handoff
    optional: false
    description: "Create the Superpowers handoff after Spec Kit task generation"

tags:
  - superpowers
  - implementation
  - handoff
  - bridge
