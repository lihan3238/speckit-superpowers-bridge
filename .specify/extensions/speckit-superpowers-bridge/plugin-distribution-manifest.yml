schema_version: 1
includes:
  - path: .specify/extensions/speckit-superpowers-bridge/**
  - path: .agents/skills/speckit-superpowers-bridge/SKILL.md
  - path: .claude/skills/speckit-superpowers-bridge/SKILL.md
  - path: README.md
  - path: README.zh-CN.md
  - path: CHANGELOG.md
  - path: LICENSE
  - path: AGENTS.md
    condition: merge bridge section if host project already has AGENTS.md
  - path: CLAUDE.md
    condition: merge bridge supplement if host project already has CLAUDE.md
excludes:
  - path: .specify/bridge-events.jsonl
    reason: project-private bridge audit log
  - path: .specify/bridge-snapshots/**
    reason: project-private rollback snapshots
  - path: .specify/superpowers-handoff.json
    reason: project-private runtime handoff state
  - path: .specify/feature.json
    reason: project-private active feature pointer
  - path: specs/**
    reason: feature design artifacts are local to the source project
  - path: tests/**
    reason: repository development tests are not installed into host projects
  - path: marketplace/**
    reason: upstream-PR artifacts are source-repo-only and not relevant to host projects
  - path: docs/release-runbook.md
    reason: maintainer-only release procedure; not part of host runtime
notes:
  - AGENTS.md and CLAUDE.md installation is conditional; merge bridge sections instead of overwriting host project instructions.
  - Official generated Spec Kit skills are not plugin assets and remain managed by specify integration commands.
  - The marketplace/ directory holds upstream-PR drafts (catalog entry, README row, PR body); these describe the bridge to the upstream Spec Kit maintainers and are never installed into host projects.
