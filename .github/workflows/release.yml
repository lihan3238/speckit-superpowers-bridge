name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux-gate:
    name: Linux bash release gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Validate release readiness
        shell: pwsh
        run: ./scripts/release/validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Run Linux bash smoke tests
        shell: bash
        run: bash tests/run-all.sh

      - name: Run release-tooling self-tests
        shell: pwsh
        run: ./scripts/release/test-validate-release-readiness.ps1

  windows-gate:
    name: Windows PowerShell release gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        shell: powershell
        run: |
          $v = "${env:GITHUB_REF_NAME}".Substring(1)
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Version: $v"

      - name: Validate release readiness
        shell: powershell
        run: .\scripts\release\validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Run Windows PowerShell bridge smoke
        shell: powershell
        run: .\tests\test-release-powershell.ps1

      - name: Run release-tooling self-tests
        shell: powershell
        run: .\scripts\release\test-validate-release-readiness.ps1

  release:
    name: Build + publish release
    needs:
      - linux-gate
      - windows-gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Validate release readiness
        shell: pwsh
        run: ./scripts/release/validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Build extension ZIP
        shell: pwsh
        run: ./scripts/release/build-extension-zip.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Validate release package
        shell: pwsh
        run: ./scripts/release/validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}' -PackageZip 'dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip'

      - name: Run package smoke
        shell: bash
        run: bash tests/test-release-package.sh

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $body = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s*\[$([regex]::Escape($v))\][^\r\n]*\r?\n(.*?)(?=^##\s*\[|\Z)"
          $m = [regex]::Match($body, $pattern)
          if (-not $m.Success) {
            Write-Output "::error::No '## [$v]' section in CHANGELOG.md"
            exit 1
          }
          $notes = $m.Groups[1].Value.Trim()
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding UTF8
          Write-Output "Notes (first 300 chars):"
          Write-Output ($notes.Substring(0, [Math]::Min(300, $notes.Length)))

      - name: Create GitHub release with ZIP asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip" \
            "dist/speckit-superpowers-bridge.zip"

      - name: Summary
        shell: pwsh
        run: |
          $sha = (Get-FileHash -LiteralPath "dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip" -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip"
          $latestUrl = "https://github.com/${{ github.repository }}/releases/latest/download/speckit-superpowers-bridge.zip"
          $summary = @"
          ## Release published

          - Tag: $env:GITHUB_REF_NAME
          - Asset URL: $url
          - Latest alias URL: $latestUrl
          - SHA256: $sha

          ### Next manual step (cross-repo)

          Open a clean Extension Submission issue at github/spec-kit with the new version metadata. Body template lives at marketplace/extension-submission-body.md.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
